<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d6efd" />
    <title>Task due — Reminder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
      :root {
        --alarm-blue-deep: #084298;
        --alarm-blue-mid: #0d6efd;
        --alarm-blue-light: #3d8bfd;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #fff;
        background: var(--alarm-blue-deep);
      }
      .alarm-screen {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(2rem, env(safe-area-inset-bottom));
        text-align: center;
        background: linear-gradient(165deg, var(--alarm-blue-light) 0%, var(--alarm-blue-mid) 42%, var(--alarm-blue-deep) 100%);
        animation: alarm-bg 2s ease-in-out infinite;
      }
      @keyframes alarm-bg {
        0%,
        100% {
          filter: brightness(1);
        }
        50% {
          filter: brightness(1.08);
        }
      }
      .alarm-icon {
        font-size: clamp(2.5rem, 12vw, 3.75rem);
        margin-bottom: 1rem;
      }
      .alarm-eyebrow {
        margin: 0;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .alarm-title {
        margin: 0.75rem 0 0.5rem;
        font-size: clamp(1.5rem, 6vw, 2.25rem);
        font-weight: 600;
        max-width: 24ch;
        word-break: break-word;
      }
      .alarm-due {
        margin: 0;
        font-size: 0.9375rem;
        opacity: 0.9;
      }
      .alarm-dismiss {
        margin-top: 2rem;
        padding: 0.65rem 1.5rem;
        font-size: 0.875rem;
        font-weight: 600;
        border: 1px solid rgba(255, 255, 255, 0.85);
        border-radius: 0.375rem;
        background: #fff;
        color: var(--alarm-blue-deep);
        cursor: pointer;
      }
      .alarm-hint {
        margin-top: 1.25rem;
        font-size: 0.8125rem;
        opacity: 0.85;
        max-width: 28rem;
      }
      .sound-prompt {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: rgba(8, 66, 152, 0.92);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .sound-prompt.hidden {
        display: none;
      }
      .sound-prompt__card {
        max-width: 20rem;
        padding: 1.5rem;
        border-radius: 0.75rem;
        background: rgba(255, 255, 255, 0.12);
        border: 2px solid rgba(255, 255, 255, 0.35);
        animation: pulse-ring 1.2s ease-in-out infinite;
      }
      @keyframes pulse-ring {
        0%,
        100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.35);
        }
        50% {
          transform: scale(1.02);
          box-shadow: 0 0 0 12px rgba(255, 255, 255, 0);
        }
      }
      .sound-prompt__title {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
        font-weight: 700;
      }
      .sound-prompt__text {
        margin: 0;
        font-size: 0.875rem;
        opacity: 0.95;
      }
    </style>
  </head>
  <body>
    <div id="sound-prompt" class="sound-prompt" role="button" tabindex="0" aria-label="Tap to start alarm sound">
      <div class="sound-prompt__card">
        <p class="sound-prompt__title"><i class="bi bi-volume-up-fill" aria-hidden="true"></i> Tap to start alarm</p>
        <p class="sound-prompt__text">Your browser needs one tap before it can play sound.</p>
      </div>
    </div>

    <div class="alarm-screen" role="alertdialog" aria-labelledby="alarm-title" aria-modal="true">
      <div class="alarm-icon" aria-hidden="true"><i class="bi bi-alarm-fill"></i></div>
      <p class="alarm-eyebrow" id="alarm-eyebrow">Due in about 10 minutes</p>
      <h1 class="alarm-title" id="alarm-title">Task</h1>
      <p class="alarm-due" id="alarm-due"></p>
      <button type="button" class="alarm-dismiss" id="alarm-dismiss">Stop alarm and dismiss</button>
      <p class="alarm-hint">Dismiss here or submit the task in Task Manager.</p>
    </div>

    <audio id="alarm-audio" src="/sounds/alarm-beep.wav" loop preload="auto"></audio>

    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        const title = params.get("title") || "Your task";
        const dueAt = params.get("dueAt");
        const slot = params.get("slot");
        const fromNotify = params.get("from") === "notify";

        if (slot === "followup1h") {
          document.getElementById("alarm-eyebrow").textContent = "Still not submitted — follow-up reminder";
        }
        document.getElementById("alarm-title").textContent = title;
        const dueEl = document.getElementById("alarm-due");
        if (dueAt) {
          try {
            dueEl.textContent = "Deadline: " + new Date(dueAt).toLocaleString();
          } catch {
            dueEl.textContent = "";
          }
        }

        const soundPrompt = document.getElementById("sound-prompt");
        const alarmAudio = document.getElementById("alarm-audio");
        let beepTimer = null;
        let audioCtx = null;
        let wakeLock = null;
        let soundActive = false;

        function hideSoundPrompt() {
          soundPrompt.classList.add("hidden");
        }

        function showSoundPrompt() {
          soundPrompt.classList.remove("hidden");
        }

        function stopSound() {
          soundActive = false;
          if (beepTimer) {
            clearInterval(beepTimer);
            beepTimer = null;
          }
          if (audioCtx) {
            audioCtx.close().catch(function () {});
            audioCtx = null;
          }
          alarmAudio.pause();
          alarmAudio.currentTime = 0;
        }

        function startHtmlAudio() {
          alarmAudio.volume = 1;
          return alarmAudio.play().then(function () {
            soundActive = true;
            hideSoundPrompt();
            return true;
          });
        }

        function startWebAudioBeeps() {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return Promise.resolve(false);
          stopSound();
          audioCtx = new Ctx();
          return audioCtx.resume().then(function () {
            let high = true;
            const master = audioCtx.createGain();
            master.gain.value = 0.65;
            master.connect(audioCtx.destination);
            function beep() {
              if (!audioCtx) return;
              const osc = audioCtx.createOscillator();
              const g = audioCtx.createGain();
              osc.type = "square";
              osc.frequency.value = high ? 880 : 698;
              high = !high;
              const t = audioCtx.currentTime;
              g.gain.setValueAtTime(0.001, t);
              g.gain.exponentialRampToValueAtTime(0.75, t + 0.03);
              g.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
              osc.connect(g);
              g.connect(master);
              osc.start(t);
              osc.stop(t + 0.45);
            }
            beep();
            beepTimer = setInterval(beep, 420);
            soundActive = true;
            hideSoundPrompt();
            return true;
          });
        }

        function startAlarmSound() {
          if (soundActive) return Promise.resolve(true);
          if (navigator.vibrate) navigator.vibrate([500, 150, 500, 150, 500]);
          return startHtmlAudio().catch(function () {
            return startWebAudioBeeps();
          }).catch(function () {
            showSoundPrompt();
            return false;
          });
        }

        function onUnlockTap() {
          startAlarmSound();
        }

        soundPrompt.addEventListener("pointerdown", function (e) {
          e.preventDefault();
          onUnlockTap();
        });
        soundPrompt.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") onUnlockTap();
        });
        document.querySelector(".alarm-screen").addEventListener("pointerdown", function () {
          if (!soundActive) onUnlockTap();
        });

        async function enterFullscreen() {
          try {
            const el = document.documentElement;
            if (el.requestFullscreen) await el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
          } catch {
            /* ignore */
          }
        }

        async function requestWakeLock() {
          try {
            if ("wakeLock" in navigator) {
              wakeLock = await navigator.wakeLock.request("screen");
            }
          } catch {
            /* ignore */
          }
        }

        document.getElementById("alarm-dismiss").addEventListener("click", function () {
          stopSound();
          if (wakeLock) wakeLock.release().catch(function () {});
          if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
          window.close();
          if (!window.closed) location.href = "/";
        });

        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") {
            requestWakeLock();
            if (soundActive) startAlarmSound();
          }
        });

        enterFullscreen();
        requestWakeLock();

        startAlarmSound().then(function (ok) {
          if (!ok) showSoundPrompt();
        });

        if (fromNotify) {
          setTimeout(function () {
            if (!soundActive) showSoundPrompt();
          }, 400);
        }
      })();
    </script>
  </body>
</html>
